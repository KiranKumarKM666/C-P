services:
  - type: web
    name: facultyflow
    env: python
    buildCommand: "pip install -r facultyflow/backend/requirements.txt"
    startCommand: "cd facultyflow/backend && python entrypoint.py"
    healthCheckPath: /health
    plan: free
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: facultyflow-db
          property: connectionString

databases:
  - name: facultyflow-db
    plan: free
